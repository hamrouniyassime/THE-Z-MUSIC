<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a14">
<title>THE Z MUSIC</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07070d;
  --bg2:#0d0d1a;
  --surface:#13131f;
  --surface2:#191928;
  --surface3:#1f1f33;
  --line:#2a2a42;
  --text:#f5f5fb;
  --muted:#8e8ead;
  --muted2:#6b6b8a;
  --violet:#8b5cf6;
  --violet2:#a78bfa;
  --pink:#ec4899;
  --indigo:#4f46e5;
  --grad:linear-gradient(135deg,var(--violet) 0%,var(--pink) 100%);
  --grad-soft:linear-gradient(135deg,#8b5cf633,#ec489933);
  --radius:18px;
  --shadow:0 20px 60px -20px #00000090;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Segoe UI",system-ui,-apple-system,"Cairo","Tajawal",sans-serif;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%,#5b21b64a 0%,transparent 55%),
    radial-gradient(ellipse 700px 500px at 100% 10%,#be185d3d 0%,transparent 50%),
    radial-gradient(ellipse 900px 600px at 50% 120%,#4338ca33 0%,transparent 55%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:110px;
}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(18px);
  background:#07070dcc;
  border-bottom:1px solid #ffffff0f;
}
.topbar-inner{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandblock{display:flex;align-items:center;gap:11px}
.logo{
  width:42px;height:42px;border-radius:13px;flex:0 0 42px;
  background:var(--grad);
  display:grid;place-items:center;font-size:19px;font-weight:800;color:#fff;
  box-shadow:0 6px 20px -4px #ec489966;
}
.brandtext{display:flex;flex-direction:column;line-height:1.25}
.brandtitle{font-weight:800;font-size:17px;letter-spacing:.3px}
.brandsub{font-size:10.5px;color:var(--muted2);letter-spacing:1.5px;font-weight:600}
.statusdot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.statusdot span.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399aa}

/* ===== Hero ===== */
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.hero{
  position:relative;overflow:hidden;
  margin-top:20px;border-radius:26px;padding:34px 28px;
  background:
    radial-gradient(ellipse 500px 300px at 85% -20%,#ec489955,transparent 60%),
    linear-gradient(135deg,#1b0f3a,#2a0f2e 55%,#120a2e);
  border:1px solid #ffffff14;
  box-shadow:var(--shadow);
}
.hero-eyebrow{font-size:12px;color:var(--violet2);font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.hero-eyebrow:before{content:"";width:16px;height:2px;background:var(--grad);border-radius:2px}
.hero h1{font-size:clamp(26px,5vw,40px);margin:14px 0 8px;line-height:1.2;font-weight:800}
.hero p{margin:0;max-width:580px;color:#cfc9e8;font-size:15px;line-height:1.7}
.hero-stats{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}
.statbox{display:flex;flex-direction:column;gap:2px}
.statnum{font-size:21px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.statlabel{font-size:11.5px;color:var(--muted)}

/* ===== Screens ===== */
.screen{display:none}
.screen.active{display:block}

/* ===== Layout ===== */
.layout{display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:22px}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.panelhead h2{font-size:16.5px;margin:0;font-weight:700}
.muted{color:var(--muted);font-size:12.5px}
.ghostbtn{
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:9px 13px;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:.15s;font-weight:600;
}
.ghostbtn:hover{background:var(--surface3);border-color:#ffffff22}

/* ===== Search ===== */
.searchrow{display:flex;gap:9px;margin-bottom:16px}
.searchbox{position:relative;flex:1}
.searchbox svg{position:absolute;right:13px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.input{
  width:100%;font:inherit;border:1px solid var(--line);background:var(--surface2);color:var(--text);
  border-radius:13px;padding:12px 40px 12px 14px;outline:none;transition:.15s;font-size:14px;
}
.input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #8b5cf62e}
.input::placeholder{color:var(--muted2)}

/* ===== Track list ===== */
.tracklist{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow-y:auto;margin:-4px;padding:4px}
.tracklist::-webkit-scrollbar{width:6px}
.tracklist::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.track{
  display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:14px;
  background:transparent;border:1px solid transparent;cursor:pointer;transition:.15s;position:relative;
}
.track:hover{background:var(--surface2);border-color:#ffffff10}
.track.active{background:linear-gradient(90deg,#8b5cf61f,#ec48991a);border-color:#8b5cf64a}
.trackidx{width:22px;flex:0 0 22px;text-align:center;font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums}
.track.active .trackidx{color:transparent;position:relative}
.track.active .trackidx:after{
  content:"";position:absolute;inset:0;margin:auto;width:13px;height:13px;
  background:var(--grad);mask:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 10h2v4H3zm4-3h2v10H7zm4-4h2v18h-2zm4 6h2v6h-2zm4-3h2v12h-2z"/></svg>') center/contain no-repeat;
}
.cover{
  width:42px;height:42px;flex:0 0 42px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2d2254,#4a1942);font-size:17px;color:#d8c8ff;overflow:hidden;
}
.trackinfo{min-width:0;flex:1}
.trackname{font-weight:600;font-size:13.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.track.active .trackname{color:var(--violet2)}

/* ===== Marquee for overflowing track names ===== */
.trackname.marquee{
  text-overflow:clip;
  position:relative;
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
}
.trackname.marquee .marquee-track{
  display:inline-flex;width:max-content;
  animation:trackMarquee linear infinite;
  animation-duration:var(--marquee-duration,10s);
}
.trackname.marquee .marquee-seg{padding-inline-end:48px;flex:0 0 auto}
@keyframes trackMarquee{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
[dir="rtl"] .trackname.marquee .marquee-track{animation-name:trackMarqueeRTL}
@keyframes trackMarqueeRTL{
  from{transform:translateX(0)}
  to{transform:translateX(50%)}
}
@media(prefers-reduced-motion:reduce){
  .trackname.marquee .marquee-track{animation:none}
}
.trackmeta{font-size:11.5px;color:var(--muted2);margin-top:2px}
.actions{display:flex;gap:4px;opacity:1;transition:.15s}
@media(hover:hover){
  .actions{opacity:0}
  .track:hover .actions,.track.active .actions{opacity:1}
}
.iconbtn{
  width:33px;height:33px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.15s;flex:0 0 33px;
}
.iconbtn:hover{background:var(--surface3);border-color:#ffffff28;transform:translateY(-1px)}
.empty{padding:38px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;font-size:13.5px;line-height:1.8}
.status{font-size:12px;color:var(--violet2);margin-top:12px;min-height:16px}

/* ===== Now playing side panel ===== */
.now{position:sticky;top:78px}
.disc-wrap{display:flex;justify-content:center;margin:6px 0 20px}
.disc{
  width:150px;height:150px;border-radius:50%;
  background:repeating-radial-gradient(circle,#0c0c14 0 4px,#1b1b2c 5px 8px);
  display:grid;place-items:center;box-shadow:0 18px 45px -12px #000a;position:relative;
  border:1px solid #ffffff10;
}
.disc:before{
  content:"";width:50px;height:50px;border-radius:50%;background:var(--grad);
  border:5px solid #0c0c14;box-shadow:0 0 0 1px #ffffff14;
}
.disc.playing{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nowbadge{text-align:center;font-size:10.5px;letter-spacing:1.5px;color:var(--muted2);font-weight:700;margin-bottom:6px}
.nowtitle{text-align:center;font-weight:700;font-size:16px;overflow-wrap:anywhere;padding:0 6px}
.nowartist{text-align:center;color:var(--muted);font-size:12.5px;margin-top:5px}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:22px 0 14px}
.ctrlbtn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.15s;font-size:15px;
}
.ctrlbtn:hover{background:var(--surface3);border-color:#ffffff28}
.ctrlbtn.repeatbtn{position:relative;color:var(--muted2)}
.ctrlbtn.repeatbtn.on{color:var(--violet2);border-color:#8b5cf64a;background:linear-gradient(90deg,#8b5cf61f,#ec48991a)}
.ctrlbtn.repeatbtn .repeatlabel{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;
  color:var(--muted2);white-space:nowrap;letter-spacing:.3px;
}
.ctrlbtn.repeatbtn.on .repeatlabel{color:var(--violet2)}
.playmain{
  width:58px;height:58px;border-radius:50%;font-size:20px;border:0;
  background:var(--grad);color:#fff;box-shadow:0 10px 30px -8px #ec489977;
}
.playmain:hover{transform:scale(1.05);box-shadow:0 12px 34px -6px #ec489999}
.progress{
  width:100%;appearance:none;height:5px;border-radius:3px;background:var(--surface3);outline:none;cursor:pointer;
}
.progress::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:var(--violet2);box-shadow:0 0 0 4px #8b5cf633;cursor:pointer}
.progress::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--violet2);border:0;box-shadow:0 0 0 4px #8b5cf633;cursor:pointer}
.time{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);margin-top:6px;font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line);margin:18px 0}
.sidehint{font-size:12.5px;line-height:1.8;color:var(--muted);display:flex;gap:9px;align-items:flex-start}
.sidehint .hiconwrap{flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:var(--grad-soft);display:grid;place-items:center;font-size:13px}
.badge{font-size:10.5px;padding:5px 10px;border-radius:999px;background:var(--grad-soft);color:var(--violet2);white-space:nowrap;font-weight:700;letter-spacing:.5px;border:1px solid #8b5cf633}

/* ===== Now Playing full screen ===== */
.playerscreen{max-width:460px;margin:26px auto 0;padding:0 16px}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.backbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.15s;flex:0 0 38px;font-size:16px;
}
.backbtn:hover{background:var(--surface3);border-color:#ffffff28}
.backlabel{font-size:12.5px;color:var(--muted);font-weight:600}
.playerpanel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px 24px;position:relative;overflow:hidden}
.pulldown-zone{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:6px;touch-action:pan-y;cursor:grab;user-select:none}
.pulldown-arrow{font-size:18px;color:var(--muted2);transition:transform .2s}
.pulldown-arrow.flip{transform:rotate(180deg);color:var(--violet2)}
.pulldown-hint{font-size:10.5px;color:var(--muted2);letter-spacing:.3px}
.download-reveal{
  max-height:0;opacity:0;overflow:hidden;transition:max-height .28s ease,opacity .28s ease,margin .28s ease;
  text-align:center;margin:0;
}
.download-reveal.open{max-height:140px;opacity:1;margin:4px 0 18px}
.download-title{font-size:13px;color:var(--violet2);font-weight:700;margin-bottom:10px}
.download-cta{
  display:inline-flex;align-items:center;gap:9px;background:var(--grad);color:#fff;border:0;
  border-radius:14px;padding:13px 22px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 26px -8px #ec489977;transition:.15s;
}
.download-cta:hover{transform:translateY(-1px);box-shadow:0 12px 30px -6px #ec489999}
.disc-wrap.big{margin:6px 0 26px}
.disc.big{width:220px;height:220px}
.disc.big:before{width:72px;height:72px;border-width:7px}

/* ===== Settings ===== */
.setting-group{margin-top:4px}
.setting-label{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:12px}
.lang-options{display:flex;flex-direction:column;gap:8px}
.langopt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:start;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:13px 14px;cursor:pointer;transition:.15s;font:inherit;font-size:14.5px;
}
.langopt:hover{background:var(--surface3);border-color:#ffffff22}
.langopt.active{background:linear-gradient(90deg,#8b5cf61f,#ec48991a);border-color:#8b5cf64a}
.langflag{font-size:19px;flex:0 0 auto}
.langname{flex:1;font-weight:600}
.langcheck{opacity:0;color:var(--violet2);font-weight:800;transition:.15s}
.langopt.active .langcheck{opacity:1}

/* ===== Sticky mini player for mobile ===== */
.mobileplayer{display:none}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .now{position:static}
  body{padding-bottom:100px}
}
@media(max-width:620px){
  .hero{padding:24px 18px}
  .hero-stats{gap:16px}
  .wrap{padding:0 12px}
  .panel{padding:15px}
  .track{padding:9px 8px}
  .trackidx{display:none}
}

.foot{text-align:center;color:var(--muted2);font-size:11.5px;margin-top:26px;padding-bottom:10px;line-height:1.8}
.foot b{color:var(--muted)}

/* ===== Welcome overlay ===== */
.welcome-overlay{
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:center;justify-content:center;
  padding:22px;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%,#5b21b65c 0%,transparent 55%),
    radial-gradient(ellipse 700px 500px at 100% 10%,#be185d4d 0%,transparent 50%),
    radial-gradient(ellipse 900px 600px at 50% 120%,#4338ca40 0%,transparent 55%),
    var(--bg);
  animation:welcomeFadeIn .35s ease-out;
}
.welcome-overlay.hide{animation:welcomeFadeOut .35s ease-in forwards}
@keyframes welcomeFadeIn{from{opacity:0}to{opacity:1}}
@keyframes welcomeFadeOut{from{opacity:1}to{opacity:0;visibility:hidden}}
.welcome-card{
  width:100%;max-width:420px;
  text-align:center;
  border-radius:26px;padding:38px 28px 30px;
  background:linear-gradient(135deg,#1b0f3a,#2a0f2e 55%,#120a2e);
  border:1px solid #ffffff14;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.welcome-card:before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 500px 300px at 85% -20%,#ec489955,transparent 60%);
  pointer-events:none;
}
.welcome-logo{
  width:72px;height:72px;border-radius:20px;margin:0 auto 18px;
  background:var(--grad);
  display:grid;place-items:center;font-size:32px;font-weight:800;color:#fff;
  box-shadow:0 10px 30px -6px #ec489966;
  position:relative;
}
.welcome-title{font-size:21px;font-weight:800;margin:0 0 6px;position:relative}
.welcome-sub{font-size:13px;color:var(--muted2);letter-spacing:1px;font-weight:600;margin:0 0 20px;position:relative}
.welcome-text{font-size:14.5px;color:#cfc9e8;line-height:1.7;margin:0 0 26px;position:relative}
.welcome-main-btn{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px 20px;border:none;border-radius:16px;
  background:var(--grad);color:#fff;font-size:16px;font-weight:800;
  cursor:pointer;transition:.15s;
  box-shadow:0 10px 26px -8px #ec489977;
}
.welcome-main-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.welcome-main-btn:active{transform:translateY(0)}
.welcome-stay-btn{
  position:relative;
  display:block;width:100%;margin-top:14px;padding:10px;
  background:transparent;border:none;color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;transition:.15s;
}
.welcome-stay-btn:hover{color:var(--text)}
</style>
</head>
<body>
<div class="welcome-overlay" id="welcomeOverlay">
  <div class="welcome-card">
    <div class="welcome-logo">♫</div>
    <h1 class="welcome-title" data-i18n="welcomeTitle"></h1>
    <div class="welcome-sub" data-i18n="welcomeSub"></div>
    <p class="welcome-text" data-i18n="welcomeText"></p>
    <button class="welcome-main-btn" id="welcomeVisitBtn" data-i18n="welcomeVisitBtn"></button>
    <button class="welcome-stay-btn" id="welcomeStayBtn" data-i18n="welcomeStayBtn"></button>
  </div>
</div>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brandblock">
      <div class="logo">♫</div>
      <div class="brandtext">
        <div class="brandtitle">THE Z MUSIC</div>
        <div class="brandsub">BY THE ZYZ STUDIO</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="statusdot"><span class="dot"></span><span id="libCountTop">—</span></div>
      <button class="iconbtn" id="settingsBtn" data-i18n-title="settingsTitleAttr" style="width:38px;height:38px;flex:0 0 38px;border-radius:12px;font-size:16px">⚙</button>
    </div>
  </div>
</div>

<div class="wrap">

  <section class="screen active" id="screen-library">
    <div class="panel" style="margin-top:22px">
      <div class="panelhead">
        <div><h2 data-i18n="libraryTitle"></h2><div class="muted" id="count" data-i18n="loadingTracks"></div></div>
        <button class="ghostbtn" id="refresh"><span data-i18n="refreshIcon">↻</span> <span data-i18n="refresh"></span></button>
      </div>
      <div class="searchrow">
        <div class="searchbox">
          <input class="input" id="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
      </div>
      <div class="tracklist" id="tracks"><div class="empty" data-i18n="readingLibrary"></div></div>
      <div class="status" id="libraryStatus" role="status"></div>
    </div>
    <footer class="foot">THE Z MUSIC · <b>BY THE ZYZ STUDIO</b></footer>
  </section>

  <section class="screen playerscreen" id="screen-player">
    <div class="backrow">
      <button class="backbtn" id="backBtn" data-i18n-title="backToLibraryAttr">→</button>
      <span class="backlabel" data-i18n="backToLibrary"></span>
    </div>
    <div class="playerpanel" id="playerPanel">
      <div class="pulldown-zone" id="pulldownZone">
        <div class="pulldown-arrow" id="pulldownArrow">⌄</div>
        <div class="pulldown-hint" id="pulldownHint" data-i18n="pullDownHint"></div>
      </div>
      <div class="download-reveal" id="downloadReveal">
        <div class="download-title" id="downloadTitle" data-i18n="downloadNowTitle"></div>
        <button class="download-cta" id="downloadCta">
          <span>⬇</span><span data-i18n="downloadNowBtn"></span>
        </button>
      </div>
      <div class="panelhead"><h2 data-i18n="nowPlayingTitle"></h2><span class="badge" data-i18n="playerBadge"></span></div>
      <div class="disc-wrap big"><div class="disc big" id="disc"></div></div>
      <div class="nowbadge" data-i18n="nowPlayingBadge"></div>
      <div class="nowtitle" id="nowTitle" data-i18n="chooseTrack"></div>
      <div class="nowartist" id="nowMeta">MP3 • WAV • OGG • M4A</div>
      <audio id="audio" preload="metadata"></audio>
      <div class="controls">
        <button class="ctrlbtn" id="prev" data-i18n-title="forwardAttr">⏭</button>
        <button class="playmain" id="toggle" data-i18n-title="playPauseAttr">▶</button>

let lang=localStorage.getItem('zmusic_lang')||'ar';
const audio=document.getElementById('audio'), tracksEl=document.getElementById('tracks');
let tracks=[], current=-1;
const REPEAT_MODES=['next','one','prev'];
const REPEAT_ICONS={next:'⏭',one:'🔁',prev:'⏮'};
let repeatMode=localStorage.getItem('zmusic_repeat')||'next';
if(!REPEAT_MODES.includes(repeatMode))repeatMode='next';
const $=id=>document.getElementById(id);
const t=key=>I18N[lang][key];
function fmt(s){if(!Number.isFinite(s)||s<0)return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function safeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyLang(){
 document.documentElement.lang=lang;
 document.documentElement.dir=I18N[lang].dir;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(typeof v==='string')el.textContent=v});
 document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));
 document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
 document.querySelectorAll('.langopt').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 render();
 if(current>=0&&tracks[current])$('nowMeta').textContent=tracks[current].ext.toUpperCase()+' · THE Z MUSIC';
 if(current<0)$('nowTitle').textContent=t('chooseTrack');
 applyRepeatUI();
}
function applyRepeatUI(){
 $('repeatIcon').textContent=REPEAT_ICONS[repeatMode];
 $('repeatLabel').textContent=repeatMode==='next'?t('repeatNext'):repeatMode==='prev'?t('repeatPrev'):t('repeatOne');
 $('repeatBtn').classList.toggle('on',repeatMode!=='next');
 $('repeatBtn').title=t('repeatAttr')+' — '+(repeatMode==='next'?t('repeatModeNext'):repeatMode==='prev'?t('repeatModePrev'):t('repeatModeOne'));
}
function cycleRepeat(){
 const i=REPEAT_MODES.indexOf(repeatMode);
 repeatMode=REPEAT_MODES[(i+1)%REPEAT_MODES.length];
 localStorage.setItem('zmusic_repeat',repeatMode);
 applyRepeatUI();
 $('libraryStatus').textContent='';
}
function setLang(l){lang=l;localStorage.setItem('zmusic_lang',l);applyLang()}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const visible=tracks.map((t2,i)=>({...t2,index:i})).filter(t2=>t2.name.toLowerCase().includes(q));
 $('count').textContent=t('tracksAvailable')(tracks.length);
 $('libCountTop').textContent=t('tracksShort')(tracks.length);
 if(!visible.length){tracksEl.innerHTML=`<div class="empty">${tracks.length?t('noResults'):t('noFiles')}</div>`;return}
 tracksEl.innerHTML=visible.map(tr=>`<div class="track${tr.index===current?' active':''}" data-row="${tr.index}"><div class="trackidx">${tr.index+1}</div><div class="cover">♫</div><div class="trackinfo"><div class="trackname" title="${safeText(tr.name)}"><span class="marquee-plain">${safeText(tr.name)}</span></div><div class="trackmeta">${safeText(tr.ext.toUpperCase())} · ${t('audioFileLabel')}</div></div><div class="actions"><button class="iconbtn" data-play="${tr.index}" title="${t('playTitle')}">▶</button><button class="iconbtn" data-download="${tr.index}" title="${t('downloadTitle')}">⬇</button></div></div>`).join('');
 tracksEl.querySelectorAll('[data-row]').forEach(row=>row.addEventListener('click',(e)=>{if(e.target.closest('[data-download]'))return;playTrack(Number(row.dataset.row))}));
 tracksEl.querySelectorAll('[data-download]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();const tr=tracks[Number(b.dataset.download)];if(tr)location.href=tr.downloadUrl}));
 setupMarquees();
}
function setupMarquees(){
 tracksEl.querySelectorAll('.trackname').forEach(el=>{
  const plain=el.querySelector('.marquee-plain');
  if(!plain)return;
  const text=plain.textContent;
  const overflowing=plain.scrollWidth>el.clientWidth+1;
  if(!overflowing){
   el.classList.remove('marquee');
   return;
  }
  el.classList.add('marquee');
  el.innerHTML=`<span class="marquee-track"><span class="marquee-seg">${safeText(text)}</span><span class="marquee-seg">${safeText(text)}</span></span>`;
  const seg=el.querySelector('.marquee-seg');
  const segWidth=seg.getBoundingClientRect().width;
  const pxPerSec=55;
  const duration=Math.max(6,segWidth/pxPerSec);
  el.querySelector('.marquee-track').style.setProperty('--marquee-duration',duration+'s');
 });
}
window.addEventListener('resize',()=>{clearTimeout(window.__mqResize);window.__mqResize=setTimeout(setupMarquees,200)});
async function loadTracks(){
 $('libraryStatus').textContent='';tracksEl.innerHTML=`<div class="empty">${t('loadingLibrary')}</div>`;
 try{const r=await fetch('/api/tracks',{cache:'no-store'});if(!r.ok)throw new Error(t('connectFailed'));const data=await r.json();tracks=data.tracks||[];render();if(!tracks.length)$('libraryStatus').textContent=t('needUpload');restoreLastTrack()}
 catch(e){tracks=[];render();$('libraryStatus').textContent=t('loadFailed')}
}
function saveResumeState(){
 if(current<0||!tracks[current])return;
 try{localStorage.setItem('zmusic_resume',JSON.stringify({name:tracks[current].name,time:audio.currentTime||0}))}catch(e){}
}
function restoreLastTrack(){
 let saved=null;
 try{saved=JSON.parse(localStorage.getItem('zmusic_resume')||'null')}catch(e){}
 if(!saved||!saved.name||!tracks.length)return;
 const idx=tracks.findIndex(tr=>tr.name===saved.name);
 if(idx<0)return;
 current=idx;const tr=tracks[idx];
 audio.src=tr.streamUrl;$('nowTitle').textContent=tr.name;$('nowMeta').textContent=tr.ext.toUpperCase()+' · THE Z MUSIC';
 render();
 const resumeTime=Number(saved.time)||0;
 if(resumeTime>0){
  audio.addEventListener('loadedmetadata',function setT(){audio.currentTime=resumeTime;audio.removeEventListener('loadedmetadata',setT)});
 }
}
function showScreen(name){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 $('screen-'+name).classList.add('active');

function initMediaSessionHandlers(){
 if(!('mediaSession' in navigator))return;
 try{
  navigator.mediaSession.setActionHandler('play',()=>audio.play().catch(()=>{}));
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',goPrev);
  navigator.mediaSession.setActionHandler('nexttrack',goNext);
  navigator.mediaSession.setActionHandler('seekto',(d)=>{if(d.seekTime!=null)audio.currentTime=d.seekTime});
  navigator.mediaSession.setActionHandler('stop',()=>audio.pause());
 }catch(e){}
}
function updateMediaSession(tr){
 if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({
  title:tr.name,artist:'THE Z MUSIC',album:'THE ZYZ STUDIO',
  artwork:[
   {src:ARTWORK_96,sizes:'96x96',type:'image/png'},
   {src:ARTWORK_192,sizes:'192x192',type:'image/png'},
   {src:ARTWORK_512,sizes:'512x512',type:'image/png'}
  ]
 });
}
function playTrack(i,opts){
 if(i<0||i>=tracks.length)return;
 opts=opts||{};
 const tr=tracks[i];
 const sameTrack=current===i&&audio.src&&audio.src.indexOf(tr.streamUrl)!==-1;
 current=i;
 $('nowTitle').textContent=tr.name;$('nowMeta').textContent=tr.ext.toUpperCase()+' · THE Z MUSIC';
 showScreen('player');
 render();
 if(sameTrack&&!opts.forceRestart){
  /* نفس الأغنية المفتوحة أصلاً: لا تعيد تحميلها، فقط افتح الشاشة واستمر من نفس المكان */
  updateMediaSession(tr);
  if(audio.paused&&opts.autoplay!==false)audio.play().catch(()=>{});
  return;
 }
 audio.src=tr.streamUrl;
 saveResumeState();
 updateMediaSession(tr);
 audio.play().then(()=>{
  $('toggle').textContent='Ⅱ';$('disc').classList.add('playing');
  if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing';
 }).catch(()=>{$('toggle').textContent='▶';$('libraryStatus').textContent=t('autoplayBlocked')});
}
function goNext(){if(tracks.length)playTrack((current+1)%tracks.length)}
function goPrev(){if(tracks.length)playTrack((current-1+tracks.length)%tracks.length)}
function handleEnded(){
 if(!tracks.length)return;
 if(repeatMode==='one'){audio.currentTime=0;audio.play().catch(()=>{});return}
 if(repeatMode==='prev'){goPrev();return}
 goNext();
}
$('backBtn').addEventListener('click',()=>showScreen('library'));
$('settingsBtn').addEventListener('click',()=>showScreen('settings'));
$('settingsBackBtn').addEventListener('click',()=>showScreen('library'));
document.querySelectorAll('.langopt').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
$('toggle').addEventListener('click',()=>{if(!audio.src){if(tracks.length)playTrack(0);return}if(audio.paused)audio.play().catch(()=>{});else audio.pause()});
$('prev').addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-10)});
$('next').addEventListener('click',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+10)});
audio.addEventListener('play',()=>{$('toggle').textContent='Ⅱ';$('disc').classList.add('playing');if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
audio.addEventListener('playing',()=>{if(current>=0&&tracks[current])updateMediaSession(tracks[current])});
audio.addEventListener('pause',()=>{$('toggle').textContent='▶';$('disc').classList.remove('playing');if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused';saveResumeState()});
audio.addEventListener('ended',handleEnded);
let lastSaveT=0;
audio.addEventListener('timeupdate',()=>{$('currentTime').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);if(Number.isFinite(audio.duration)&&audio.duration>0)$('progress').value=audio.currentTime/audio.duration*1000;if('mediaSession' in navigator&&navigator.mediaSession.setPositionState&&Number.isFinite(audio.duration)&&audio.duration>0){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:1,position:audio.currentTime})}catch(e){}}if(audio.currentTime-lastSaveT>3){lastSaveT=audio.currentTime;saveResumeState()}});
window.addEventListener('beforeunload',saveResumeState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveResumeState()});
$('progress').addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number($('progress').value)/1000*audio.duration});
$('search').addEventListener('input',render);$('refresh').addEventListener('click',loadTracks);
$('repeatBtn').addEventListener('click',cycleRepeat);
initMediaSessionHandlers();

/* ===== Pull-down to reveal download ===== */
(function(){
 const zone=$('pulldownZone'), reveal=$('downloadReveal'), arrow=$('pulldownArrow');
 let startY=0, dragging=false, open=false;
 function setOpen(v){
  open=v;
  reveal.classList.toggle('open',open);
  arrow.classList.toggle('flip',open);
 }
 function onStart(y){startY=y;dragging=true}
 function onMove(y){
  if(!dragging)return;
  const dy=y-startY;
  if(dy>36&&!open)setOpen(true);
  else if(dy<-20&&open)setOpen(false);
 }
 function onEnd(){dragging=false}
 zone.addEventListener('touchstart',e=>onStart(e.touches[0].clientY),{passive:true});
 zone.addEventListener('touchmove',e=>onMove(e.touches[0].clientY),{passive:true});
 zone.addEventListener('touchend',onEnd);
 zone.addEventListener('mousedown',e=>onStart(e.clientY));
 window.addEventListener('mousemove',e=>onMove(e.clientY));
 window.addEventListener('mouseup',onEnd);
 zone.addEventListener('click',()=>setOpen(!open));
 $('downloadCta').addEventListener('click',()=>{
  if(current<0||!tracks[current])return;
  location.href=tracks[current].downloadUrl;
 });
})();
applyLang();
loadTracks();

/* ===== Welcome overlay (first/second visit) ===== */
(function(){
 const overlay=$('welcomeOverlay');
 if(!overlay)return;
 $('welcomeVisitBtn').addEventListener('click',()=>{
  const target='https://the-z-music.onrender.com';
  const isAndroid=/android/i.test(navigator.userAgent);
  if(isAndroid){
   /* داخل تطبيقات WebView (Median/WebViewGold وغيرها) window.open() يبقى محصورًا
      داخل نفس الـ WebView. استخدام intent:// يجبر أندرويد على فتح الموقع مباشرة
      في متصفح خارجي حقيقي، لأن هذا Intent نظامي يخرج عن سيطرة الـ WebView تمامًا. */
   const noScheme=target.replace(/^https?:\/\//,'');
   const intentUrl='intent://'+noScheme+'#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url='+encodeURIComponent(target)+';end';
   try{
    location.href=intentUrl;
   }catch(e){
    location.href=target;
   }
   return;
  }
  const win=window.open(target,'_blank','noopener,noreferrer');
  if(!win){
   /* إن منع المتصفح فتح نافذة جديدة، ينتقل مباشرة إلى الموقع كحل بديل */
   location.href=target;
  }
 });
 $('welcomeStayBtn').addEventListener('click',()=>{
  overlay.classList.add('hide');
  setTimeout(()=>{overlay.remove()},380);
 });
})();
</script>
